# this can be used with the example from nav2 starter doc: https://docs.nav2.org/getting_started/index.html
# Run that example, and in another terminal run:
# ros_rerun_bridge --config <path_to_ros_rerun_bridge>/example_configs/turtlebot3_nav2.config.yaml
#
# Every module places its data in the TF frame named in the message header, so the tf modules are needed for anything
# to appear in the 3D view.

global_frame: map

modules:
  # TF: /tf_static goes on `tf_static`, the entity Rerun's URDF importer also uses
  - name: tf
    module: tf
    topic: /tf
    entity_path: tf

  - name: tf_static
    module: tf
    topic: /tf_static
    entity_path: tf_static
    qos: { depth: 10, durability: transient_local }
    params:
      static: true

  # Camera intrinsics: a pinhole from the camera frame to its image plane
  - name: camera_info
    module: camera_info
    topic: /intel_realsense_r200_depth/camera_info
    entity_path: camera/info

  # RGB image, shown in 3D through the camera's pinhole
  - name: rgb_image
    module: image
    topic: /intel_realsense_r200_depth/image_raw
    entity_path: camera/image

  # Depth point cloud
  - name: depth_points
    module: pointcloud2
    topic: /intel_realsense_r200_depth/points
    entity_path: camera/points
    params:
      colour_mode: rgb_packed

  # Particle cloud → arrows
  - name: particles_arrows
    module: particle_cloud
    topic: /particle_cloud
    entity_path: particlecloud_arrows
    params:
      mode: arrows
      arrow_axis: x # use body X as heading
      arrow_len: 0.05 # meters, scaled by weight
      radius: 0.002
      colour: [0, 255, 0, 255] # green

  # Laser scan → line strips
  - name: scan
    module: laserscan
    topic: /scan
    entity_path: scan
    params:
      mode: lines
      origin_scale: 0.3
      radius: 0.0025

  # Map (latched) and the global costmap drawn over it
  - name: map
    module: occupancy_grid
    topic: /map
    entity_path: map
    qos: { depth: 1, durability: transient_local }

  - name: global_costmap
    module: occupancy_grid
    topic: /global_costmap/costmap
    entity_path: global_costmap
    params:
      colormap: RvizCostmap
      opacity: 0.6
      draw_order: 1.0

  # Odometry → scalar plots
  - name: odom
    module: odometry
    topic: /odom
    entity_path: odometry

  # URDF logged once (latching /robot_description)
  - name: robot_description
    module: robot_description
    topic: /robot_description
    entity_path: robot
    qos: { depth: 1, durability: transient_local }
