# Example configuration for logging a robot from its URDF and joint states. Works as is with the MoveIt demos
# (e.g. `ros2 launch moveit_resources_panda_moveit_config demo.launch.py`), and with any robot publishing
# /robot_description and /joint_states. For robots that publish TF (e.g. via robot_state_publisher), the tf module can
# replace joint_states, as in examples/nav2_turtlebot3/config.yaml.

# MoveIt demos publish a static world -> <robot root link> transform. Without one, set this to the robot's root link.
global_frame: world

modules:
  # Static frames, e.g. world -> panda_link0 in the MoveIt demos
  - name: tf_static
    module: tf
    topic: /tf_static
    entity_path: tf_static
    qos: { depth: 10, durability: transient_local }
    params:
      static: true

  # URDF logged once (latching /robot_description)
  - name: robot_description
    module: robot_description
    topic: /robot_description
    entity_path: robot
    qos: { depth: 1, durability: transient_local }

  # Joint states moving the robot model (robot_description module must be loaded as well). Logged on `tf`, the entity
  # a tf module would use, so adding one later (e.g. for a camera's frames) cannot conflict.
  - name: joints
    module: joint_states
    topic: /joint_states
    entity_path: tf
