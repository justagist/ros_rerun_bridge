# An RGB-D camera from publisher.py, looking at a rippling surface. Its colour image is shown in 2D, and in 3D on the
# image plane in front of the camera. Its aligned depth image is shown in 2D, and in 3D as a point cloud.
global_frame: map
# Viewer layout and camera angle, written by ../layouts.py
blueprint: layout.rbl

modules:
  # Places the camera's optical frame in the map
  - name: tf_static
    module: tf
    topic: /tf_static
    entity_path: tf_static
    qos: { depth: 10, durability: transient_local }
    params:
      static: true

  # The pinhole from the camera frame to its image plane, where the image is drawn in 3D
  - name: camera_info
    module: camera_info
    topic: /camera/camera_info
    entity_path: camera/info

  - name: image
    module: image
    topic: /camera/image_raw
    entity_path: camera/image

  # Depth in millimetres. Through the camera_info pinhole, Rerun also draws it as a point cloud in 3D.
  - name: depth
    module: depth_image
    topic: /camera/depth/image_raw
    entity_path: camera/depth
    params:
      # The colours span the depths the publisher sends, in millimetres, instead of from 0
      depth_range: [1700, 2300]
